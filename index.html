<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cikgu Ceria">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Belajar Seronok!</title>
<script>try{var t=localStorage.getItem("tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#FFF1F7;--card:#FFFFFF;--text:#5B4670;--muted:#9583A8;--on:#4A3760;
--biru:#8CC8FF;--hijau:#7FDDBB;--kuning:#FFD978;--oren:#FFB98A;--ungu:#BBA6FF;--koral:#FF9EC2;
--biru-p:#E6F3FF;--hijau-p:#E2F8EF;--kuning-p:#FFF6D9;--oren-p:#FFEDE0;--ungu-p:#F0EAFF;--koral-p:#FFE7F0;
--sh:rgba(150,110,180,.18);--track:#F3E3F3;--garis:#F6DDEB;--latar:linear-gradient(165deg,#FFE0EE 0%,#F1E6FF 50%,#E0F0FF 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2B2342;--card:#3A2F57;--text:#F7EEFF;--muted:#C4B4DA;--on:#3A2A4F;
--biru:#86BDF2;--hijau:#74CFAE;--kuning:#F2CD72;--oren:#F2AE82;--ungu:#AE9AF5;--koral:#F293B8;
--biru-p:#33406A;--hijau-p:#2E4D50;--kuning-p:#4E4536;--oren-p:#503A3E;--ungu-p:#43386E;--koral-p:#553456;
--sh:rgba(10,5,25,.45);--track:#4A3E6A;--garis:#54467A;--latar:linear-gradient(165deg,#33274F 0%,#2A2546 50%,#1F2A45 100%)}}
:root[data-theme="dark"]{--bg:#2B2342;--card:#3A2F57;--text:#F7EEFF;--muted:#C4B4DA;--on:#3A2A4F;
--biru:#86BDF2;--hijau:#74CFAE;--kuning:#F2CD72;--oren:#F2AE82;--ungu:#AE9AF5;--koral:#F293B8;
--biru-p:#33406A;--hijau-p:#2E4D50;--kuning-p:#4E4536;--oren-p:#503A3E;--ungu-p:#43386E;--koral-p:#553456;
--sh:rgba(10,5,25,.45);--track:#4A3E6A;--garis:#54467A;--latar:linear-gradient(165deg,#33274F 0%,#2A2546 50%,#1F2A45 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:18px;line-height:1.3}
#app{max-width:760px;margin:0 auto;padding:52px 14px 40px}
body{transition:background-color .3s,color .3s}
#themeBtn{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));width:36px;height:36px;border-radius:50%;border:2px solid var(--track);background:var(--card);color:var(--text);font-size:18px;line-height:1;padding:0;cursor:pointer;z-index:100;box-shadow:0 2px 6px var(--sh);transition:background-color .3s,color .3s,border-color .3s}
.screen{display:none}.screen.on{display:block;animation:pop .35s ease}
h1{font-size:clamp(28px,7vw,42px);text-align:center;margin:12px 0 4px}
h2{font-size:clamp(22px,5.5vw,30px);text-align:center;margin:8px 0 14px}
.sub{text-align:center;color:var(--muted);margin:0 0 16px}
button{font:inherit;color:var(--text);cursor:pointer;border:0;touch-action:manipulation}
.grid{display:grid;gap:14px}
.card{--c:var(--biru);--cp:var(--biru-p);background:var(--cp);border:0;border-left:14px solid var(--c);border-radius:26px;padding:16px 18px;min-height:84px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;box-shadow:0 6px 16px var(--sh);transition:transform .1s}
.card:active{transform:translateY(4px);box-shadow:0 2px 6px var(--sh)}
.t-pra{--c:var(--oren);--cp:var(--kuning-p)}.t-t1{--c:var(--hijau);--cp:var(--hijau-p)}.t-t2{--c:var(--biru);--cp:var(--biru-p)}
.s-bm1,.s-bm2{--c:var(--oren);--cp:var(--oren-p)}.s-mat1,.s-mat2,.s-nombor{--c:var(--biru);--cp:var(--biru-p)}.s-eng1,.s-eng2,.s-warna{--c:var(--ungu);--cp:var(--ungu-p)}.s-sains1,.s-sains2{--c:var(--hijau);--cp:var(--hijau-p)}.s-huruf{--c:var(--kuning);--cp:var(--kuning-p)}
.card .em{font-size:38px;flex:none;width:68px;height:68px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.card .nm{font-size:clamp(20px,5vw,26px);font-weight:700}
.card .ds{font-size:15px;color:var(--text)}
.card .st{margin-left:auto;font-size:26px;white-space:nowrap}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pill{background:var(--card);border-radius:999px;padding:12px 20px;min-height:52px;font-weight:700;box-shadow:0 4px 12px var(--sh)}
.bar{flex:1;height:16px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--hijau);transition:width .3s}
.qbox{background:var(--card);border-radius:28px;padding:18px;text-align:center;border:4px solid var(--biru);box-shadow:0 6px 16px var(--sh);margin-bottom:14px}
#big{font-size:clamp(54px,16vw,96px);line-height:1.15;word-break:break-word;min-height:20px}
#big:empty{display:none}
#qt{font-size:clamp(22px,6vw,32px);font-weight:700;margin:6px 0 10px}
.speak{font-size:30px;width:68px;height:68px;border-radius:50%;background:var(--ungu);box-shadow:0 4px 12px var(--sh)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{--oc:var(--biru);background:var(--op,var(--biru-p));border:4px solid var(--oc);border-radius:22px;min-height:76px;padding:10px 12px;font-size:clamp(20px,5.5vw,28px);font-weight:700;box-shadow:0 4px 12px var(--sh)}
.opt:nth-child(4n+1){--oc:var(--biru);--op:var(--biru-p)}.opt:nth-child(4n+2){--oc:var(--hijau);--op:var(--hijau-p)}.opt:nth-child(4n+3){--oc:var(--kuning);--op:var(--kuning-p)}.opt:nth-child(4n+4){--oc:var(--ungu);--op:var(--ungu-p)}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--hijau);border-color:var(--hijau);color:var(--on);animation:bounce .6s}
.opt.wrong{background:var(--koral);border-color:var(--koral);color:var(--on);animation:shake .5s}
.opt:disabled{cursor:default}
#fb{text-align:center;font-size:clamp(20px,5.5vw,28px);font-weight:700;min-height:40px;margin:14px 0 6px}
.main{display:block;margin:10px auto 0;background:var(--biru);color:var(--on);font-size:24px;font-weight:700;border-radius:24px;min-height:68px;padding:10px 30px;box-shadow:0 4px 12px var(--sh)}
.main.alt{background:var(--ungu)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
#stars{font-size:clamp(54px,18vw,100px);margin:10px 0}
#stars span{display:inline-block;animation:pop .6s both}
.hide{display:none!important}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.tile{background:var(--card);border-radius:22px;padding:12px 6px;box-shadow:0 4px 12px var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px;border-bottom:6px solid var(--c,var(--biru))}
.tile:active{transform:translateY(3px)}
.tile .te{font-size:52px;line-height:1.1}
.tile .tp{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--track)}
#nImg{display:block;max-width:100%;max-height:min(42vh,340px);margin:0 auto 6px;border-radius:20px;object-fit:contain;box-shadow:0 4px 12px var(--sh)}
#nImg.hide{display:none}
#nBig.kecil{font-size:clamp(36px,9vw,56px)}
.tile .tn{font-size:16px;font-weight:700;text-align:center;line-height:1.2}
.tile:nth-child(5n+1){--c:var(--biru)}.tile:nth-child(5n+2){--c:var(--hijau)}.tile:nth-child(5n+3){--c:var(--kuning)}.tile:nth-child(5n+4){--c:var(--oren)}.tile:nth-child(5n+5){--c:var(--ungu)}
.s-pustaka,.c0{--c:var(--oren);--cp:var(--oren-p)}.c1{--c:var(--hijau);--cp:var(--hijau-p)}.c2{--c:var(--biru);--cp:var(--biru-p)}.c3{--c:var(--ungu);--cp:var(--ungu-p)}.c4{--c:var(--kuning);--cp:var(--kuning-p)}
.langs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 12px}
.langs button{background:var(--card);border:3px solid var(--track);border-radius:999px;padding:8px 16px;min-height:46px;font-weight:700;box-shadow:0 3px 8px var(--sh)}
.langs button.on{background:var(--biru);border-color:var(--biru);color:var(--on)}
.s-nota{--c:var(--hijau);--cp:var(--hijau-p)}.s-kuiz{--c:var(--biru);--cp:var(--biru-p)}.s-game{--c:var(--ungu);--cp:var(--ungu-p)}
.s-n-huruf,.s-g-padan{--c:var(--kuning);--cp:var(--kuning-p)}.s-n-nombor{--c:var(--biru);--cp:var(--biru-p)}.s-n-warna,.s-g-belon{--c:var(--ungu);--cp:var(--ungu-p)}.s-n-bentuk{--c:var(--oren);--cp:var(--oren-p)}
/* Nota */
#nBig{font-size:clamp(64px,20vw,120px);line-height:1.15;word-break:break-word}
#nTxt{font-size:clamp(48px,14vw,84px);font-weight:700;margin:4px 0}
#nSub{font-size:clamp(22px,6vw,32px);font-weight:700;margin:0 0 10px;color:var(--text)}
.nav{display:flex;gap:12px;justify-content:space-between}
.nav .main{margin:0;flex:1;font-size:22px;padding:10px 12px}
/* Padan Kad */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:420px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{aspect-ratio:1;border-radius:20px;font-size:clamp(30px,9vw,52px);font-weight:700;background:var(--ungu);color:var(--on);box-shadow:0 4px 12px var(--sh);display:grid;place-items:center;transition:transform .15s}
.mc.open{background:var(--card);color:var(--text);border:4px solid var(--biru);animation:pop .3s}
.mc.done{background:var(--hijau-p);border:4px solid var(--hijau);color:var(--text)}
.mc.no{animation:shake .5s}
/* Pecah Belon */
#gTarget{font-size:clamp(24px,6.5vw,34px);font-weight:700;text-align:center;margin:6px 0 4px}
.sky{display:flex;flex-wrap:wrap;gap:14px 10px;justify-content:center;padding:18px 0 30px}
.bl{--b:var(--biru);width:clamp(78px,20vw,104px);height:clamp(96px,25vw,128px);border-radius:50% 50% 46% 46%;background:var(--b);color:var(--on);font-size:clamp(34px,10vw,50px);font-weight:700;position:relative;box-shadow:inset -10px -12px 0 rgba(0,0,0,.08),0 6px 12px var(--sh);animation:float 2.4s ease-in-out infinite}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:26px;background:var(--muted)}
.bl:nth-child(5n+1){--b:var(--biru)}.bl:nth-child(5n+2){--b:var(--kuning);animation-delay:.4s}.bl:nth-child(5n+3){--b:var(--hijau);animation-delay:.8s}.bl:nth-child(5n+4){--b:var(--oren);animation-delay:.2s}.bl:nth-child(5n+5){--b:var(--ungu);animation-delay:.6s}
.bl.pop{animation:burst .35s forwards}
.bl.no{animation:shake .5s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes burst{to{transform:scale(1.5);opacity:0}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:scale(1)}30%{transform:scale(1.12) rotate(-2deg)}60%{transform:scale(.97) rotate(2deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
/* Tulis Huruf */
#app:has(#s-tulis.on),#app:has(#s-warna.on),#app:has(#s-bm.on),#app:has(#s-cerita.on),#app:has(#s-tb.on){max-width:1060px}
/* Tatabahasa */
#s-tb{position:relative;z-index:0}
.tbatas{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.tbatas h2{margin:0}.tbatas .masc{width:clamp(50px,7vw,72px)}.tbatas .tmas{flex-direction:row-reverse;align-items:center;gap:8px}.tbatas .tbub{margin:0}.tbatas .tbub::after{display:none}
#tbKawasan{margin:14px 0}
.tbnota{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 6px 16px var(--sh);border-top:10px solid var(--ungu);text-align:center;animation:pop .4s}
.tbadegan .crsvg{display:block;width:100%;max-height:30vh;border-radius:18px;margin-bottom:8px}
.tbtajuk{font-size:clamp(26px,4.5vw,40px);font-weight:700;color:var(--ungu)}
.tbterang{font-size:clamp(19px,2.8vw,24px);font-weight:700;margin:10px 0 16px}
.tbcontoh{display:flex;flex-direction:column;gap:10px;align-items:center}
.tbc{font-size:clamp(22px,3.6vw,32px);font-weight:700;padding:8px 18px;border-radius:16px;background:var(--biru-p);opacity:.25;transform:scale(.92);transition:opacity .4s,transform .4s,background .3s;cursor:pointer}
.tbc.muncul{opacity:1;transform:none}.tbc.on{background:var(--kuning-p);transform:scale(1.06)}
.tbc mark,.tbsoalan mark{background:#ffd23f;color:#2f3a4a;border-radius:8px;padding:0 6px;animation:pop .5s}
.tbsoalan{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 6px 16px var(--sh);font-size:clamp(24px,4vw,36px);font-weight:700;text-align:center;margin-bottom:14px;line-height:1.5}
.tbkosong{display:inline-block;min-width:110px;border-bottom:4px dashed var(--muted);margin:0 6px}
.tbkosong.isi{border-bottom:4px solid var(--hijau);color:var(--hijau);animation:pop .4s}
.tbayat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--card);border-radius:24px;padding:16px;box-shadow:0 6px 16px var(--sh)}
.tbw.tanda{background:var(--koral);color:#fff;border-color:var(--koral);animation:pop .3s}
.tbsusun{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.tbsl{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 12px;border-radius:16px;border:3px dashed var(--muted);background:var(--card)}
.tbsl b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ungu);color:#fff;display:grid;place-items:center}
.tbsl span{font-size:clamp(18px,2.8vw,24px);font-weight:700}.tbsl.isi{border:3px solid var(--hijau);background:var(--hijau-p);animation:pop .3s}
.tbkad{display:flex;flex-direction:column;gap:8px}
.tbs{background:var(--biru);color:#fff;border-radius:16px;padding:10px 16px;font-size:clamp(18px,2.8vw,24px);font-weight:700;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:opacity .3s,transform .15s}
.tbs:nth-child(3n+2){background:var(--oren)}.tbs:nth-child(3n){background:var(--hijau)}
.tbs.guna{opacity:0;transform:scale(.6);pointer-events:none;height:0;padding:0;margin:-4px 0}.tbs.no{animation:shake .5s}
.tbkarangan{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 6px 16px var(--sh);font-size:clamp(20px,3.2vw,28px);font-weight:700;line-height:1.9;margin-bottom:14px}
.tbkosong.kini{border-bottom-color:var(--oren);background:var(--kuning-p);animation:denyut 1s ease-in-out infinite}
.tbgambar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tbgb{background:var(--card);border-radius:24px;padding:10px;box-shadow:0 6px 16px var(--sh);border:4px solid var(--track);transition:transform .15s}
.tbgb .art{width:100%;height:auto}.tbgb:active{transform:scale(.96)}.tbgb.betul{border-color:var(--hijau);background:var(--hijau-p);animation:pop .4s}.tbgb.no{animation:shake .5s}
.tbrakam{justify-content:center;margin-top:12px}.tb.merakam{animation:goyang .8s ease-in-out infinite;background:#e53935}
.tbw{border:3px solid var(--track)}.tbw.betul{background:var(--hijau);color:#fff;border-color:var(--hijau);animation:pop .4s}.tbw.no{animation:shake .5s}
/* Buku cerita */
#s-cerita{position:relative;z-index:0}
.crbuku{background:var(--card);border-radius:28px;box-shadow:0 8px 22px var(--sh);overflow:hidden;border:6px solid var(--oren)}
.crbuku.selak{animation:cr-selak .5s ease}
@keyframes cr-selak{0%{transform:perspective(900px) rotateY(-12deg);opacity:.4}100%{transform:none;opacity:1}}
.crsvg{overflow:hidden}
.crlatar .crsvg{display:block;width:100%;height:auto;max-height:46vh}
.crteks{padding:14px 16px 18px}
.crayat,.crkunci{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center}
.crk{background:none;padding:4px 8px;border-radius:14px;font-size:clamp(30px,5vw,50px);font-weight:700;transition:transform .2s,background .2s}
.wsk .w0{color:#e8434f}.wsk .w1{color:#2f7fe0}
.crk .su.s0{color:#e8434f}.crk .su.s1{color:#2f7fe0}.crk .sutanda{color:var(--text)}
.crk .su{display:inline-block;transition:transform .2s}.crk .su.on{transform:scale(1.35) translateY(-4px);text-shadow:0 0 10px #ffd23f}
.crk.sorot{background:var(--kuning-p);transform:scale(1.08)}.crk.giliran{background:var(--hijau-p)}
.crcara{text-align:center}.crcara b{display:block;font-size:24px}.crcara ol{text-align:left;display:inline-block;margin:6px 0 10px;font-size:clamp(17px,2.4vw,21px);font-weight:700}
.crcara li{padding:3px 8px;border-radius:10px;transition:background .3s}.crcara li.on{background:var(--kuning-p)}
.crkunci .crk{background:var(--ungu-p);font-size:clamp(28px,4.5vw,42px)}
.crtamat{text-align:center;font-size:clamp(40px,8vw,72px);font-weight:700;color:var(--oren);animation:pop .6s}
.crbtns{justify-content:center;margin-top:14px}
.art .watak{transform-box:fill-box;transform-origin:50% 100%}
.art .watak.w-masuk{animation:w-masuk 1s ease-out}.art .watak.w-lompat{animation:w-lompat .8s ease 2}.art .watak.w-goyang{animation:xa-goyang 1.2s ease-in-out 2}.art .watak.w-dekat{animation:w-dekat 1s ease}
@keyframes w-masuk{0%{transform:translateX(-120px);opacity:0}100%{transform:none;opacity:1}}
@keyframes w-lompat{40%{transform:translateY(-22px)}70%{transform:translateY(0) scale(1.05,.95)}}
@keyframes w-dekat{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
/* BM Tahap 1 */
#s-bm{position:relative;z-index:0}
.bmatas{display:flex;gap:16px;align-items:center;justify-content:center}
.bmfoto{width:min(46%,320px);aspect-ratio:4/3;object-fit:cover;border-radius:24px;border:6px solid var(--card);box-shadow:0 6px 16px var(--sh);animation:pop .5s}
#s-bm.mtulis .bmfoto{width:min(30%,190px)}#s-bm.mtulis .masc{width:clamp(50px,6vw,70px)}#s-bm.mtulis h2{margin:4px 0 8px}#s-bm.mtulis .bmkawasan{margin:8px 0}
.bmfoto.lompat{animation:lompat .7s ease 2}
.bmatas .masc{width:clamp(60px,9vw,90px)}
.bmkawasan{margin:16px 0}
.ejaslot{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.ejaslot .bsk{display:flex;gap:6px;padding:8px;border-radius:20px;background:var(--card);box-shadow:0 4px 12px var(--sh);border:4px solid var(--track);transition:transform .3s,background .3s,border-color .3s}
.ejaslot .bsk.siap{border-color:var(--hijau);background:var(--hijau-p)}
.ejaslot .bsk.on{transform:scale(1.15);border-color:var(--kuning);background:var(--kuning-p)}

/* Kelas Al-Quran */
.t-quran,.s-q-huruf,.s-q-baris,.s-q-surah,.s-q-doa,.s-q-kuiz{--c:#8FD9A8;--cp:#E4F7EA}
.s-q-baris{--c:var(--kuning);--cp:var(--kuning-p)}.s-q-doa{--c:var(--oren);--cp:var(--oren-p)}.s-q-kuiz{--c:var(--ungu);--cp:var(--ungu-p)}
.qrar{font-family:"Amiri Quran","Geeza Pro","Noto Naskh Arabic","Al Bayan","Damascus","Arial",sans-serif;direction:rtl;font-style:normal}
.qratas{display:flex;justify-content:center}.qratas .tbub{max-width:520px}
#qrKawasan{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.qrbtns{justify-content:center;margin-top:18px}
.qrbesar{align-self:center;display:flex;flex-direction:column;align-items:center;background:var(--card);border-radius:32px;padding:6px 40px 14px;box-shadow:0 8px 0 var(--garis),0 14px 28px var(--sh)}
.qrbesar .qrar{font-size:clamp(90px,16vw,150px);line-height:1.25;color:#3FA672}.qrbesar b{font-size:30px}
.qrbesar.pop{animation:pop .35s}
.qrgrid{direction:rtl;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media (max-width:560px){.qrgrid{grid-template-columns:repeat(4,1fr)}}
.qrh{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);border:3px solid #CDEFD9;border-radius:22px;padding:6px 4px;box-shadow:0 5px 0 #CDEFD9,0 8px 14px var(--sh);transition:transform .15s}
.qrh .qrar{font-size:clamp(34px,6vw,54px);line-height:2.1;color:var(--text)}.qrh small{font-size:16px;font-weight:700;color:var(--muted)}
.qrh:active{transform:translateY(4px)}
.qrh.on{background:#8FD9A8;border-color:#8FD9A8;transform:scale(1.1)}.qrh.on .qrar,.qrh.on small{color:var(--on)}
.qrh.betul{background:var(--hijau);border-color:var(--hijau);animation:pop .4s}.qrh.no{animation:shake .5s;border-color:var(--koral)}
.qrnota{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.qrnota span{background:var(--card);border-radius:20px;padding:6px 16px;font-weight:700;box-shadow:0 4px 0 var(--garis);display:flex;align-items:center;gap:8px}
.qrnota .qrar{font-size:34px;color:#3FA672}
.qrbaris{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;direction:rtl}
.qrbr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:color-mix(in srgb,var(--card) 60%,transparent);border-radius:24px;padding:8px}
.iqgrid{direction:rtl;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.iqw{padding:12px 8px}.iqw .qrar{font-size:clamp(34px,5.5vw,50px);line-height:2.1}.iqw small{direction:ltr;font-size:17px}
.iqsurah{text-align:center;font-weight:700;font-size:22px;color:#3FA672}
.qnsimbol{align-self:center;font-size:clamp(90px,16vw,140px);line-height:1.9;color:#3FA672;background:var(--card);border-radius:36px;padding:0 44px;box-shadow:0 8px 0 var(--garis),0 14px 28px var(--sh)}
.qnkecil .qrh{padding:4px 2px}.qrh .qrar{display:block;line-height:1.5!important;padding:.25em 0 .75em}.qrh small{display:block;line-height:1.2}.qnkecil small{direction:ltr}
.qnlebar small{font-size:15px}
.qntab{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.qntab button{background:var(--card);border:3px solid var(--garis);border-radius:999px;padding:10px 20px;font-weight:700;box-shadow:0 4px 0 var(--garis)}.qntab button.on{background:#8FD9A8;border-color:#8FD9A8;color:var(--on);box-shadow:0 4px 0 #6CBF8A}
.qnterang{text-align:center;font-size:clamp(20px,3vw,26px);font-weight:700;max-width:760px;align-self:center;margin:4px 0}
.qrbaris{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.qrbaris .qrh{min-width:0;overflow:hidden}.qrbaris .qrh .qrar{font-size:clamp(26px,4vw,40px)}.qrbaris .qrh small{font-size:14px;white-space:nowrap}
.qrbismi{line-height:2.3;padding-top:6px;text-align:center;font-size:clamp(28px,5vw,42px);color:#3FA672;margin:4px 0}
.qrayat{display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:28px;padding:16px 20px;text-align:center;box-shadow:0 6px 0 var(--garis),0 10px 20px var(--sh);border:3px solid transparent;position:relative;transition:transform .2s}
.qrayat .qrar{font-size:clamp(30px,5.2vw,46px);line-height:2.4;color:var(--text)}
.qrayat i{font-size:clamp(18px,2.6vw,22px);color:#3FA672;font-weight:700}
.qrayat .qrmk{font-size:clamp(17px,2.4vw,20px);color:var(--muted);font-weight:700}
.qrayat.on{border-color:#8FD9A8;transform:scale(1.02)}
.qrno{position:absolute;left:14px;top:12px;width:34px;height:34px;border-radius:50%;background:#8FD9A8;color:var(--on);display:grid;place-items:center;font-weight:700}
.qrpesan{text-align:center;color:var(--muted);font-size:15px;font-weight:700}
.qrkira{align-self:center;font-weight:700;color:var(--muted)}
.qrsoal{display:flex;align-items:center;justify-content:center;gap:14px;font-size:clamp(26px,4vw,36px)}
.qrpilih{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:640px;width:100%;align-self:center}
.qrpilih .qrh .qrar{font-size:clamp(56px,10vw,90px)}
.qrtamat{align-self:center;text-align:center;background:var(--card);border-radius:32px;padding:20px 50px;box-shadow:0 8px 0 var(--garis)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-quran,:root:not([data-theme="light"]) .s-q-huruf,:root:not([data-theme="light"]) .s-q-surah{--cp:#2F4A3C}}:root[data-theme="dark"] .t-quran,:root[data-theme="dark"] .s-q-huruf,:root[data-theme="dark"] .s-q-surah{--cp:#2F4A3C}
.qrtamat .qrbintang{font-size:54px;color:#FFB800}.qrtamat b{font-size:40px}

/* Al-Quran: tajwid, hafazan, bacaan 30 juz */
.qtkat{align-self:center;background:#8FD9A8;color:var(--on);font-weight:700;border-radius:999px;padding:6px 18px}
.qthuruf{align-self:center;background:var(--card);border-radius:20px;padding:6px 18px;box-shadow:0 4px 0 var(--garis);font-weight:700}.qthuruf .qrar{font-size:30px;color:#3FA672}
.qtcontoh{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.qtc .qrar{font-size:clamp(30px,5vw,44px)}
.qtpilih{display:grid;grid-template-columns:1fr 1fr;gap:12px}.qtpilih .opt{font-size:clamp(17px,2.4vw,22px)}
.qhsurah{text-align:center;font-size:clamp(34px,6vw,52px);color:#3FA672;line-height:1.8}
.qhbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.qhbar button{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:3px solid var(--garis);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--garis)}
.qhbar button svg{width:20px;height:20px}.qhbar .qhtanda.on{background:#8FD9A8;border-color:#8FD9A8;color:var(--on)}
.qhsorok .qha .qrar,.qhsorok .qha .qrmk{filter:blur(9px);transition:filter .3s}.qhsorok .qha.buka .qrar,.qhsorok .qha.buka .qrmk{filter:none}
.qjmuka{direction:rtl;text-align:justify;text-align-last:center;background:var(--card);border-radius:28px;padding:20px 24px;box-shadow:0 8px 0 var(--garis),0 14px 28px var(--sh);border:4px double #CFE9D8}
.qjayat{font-size:clamp(26px,4.2vw,38px);line-height:2.3;border-radius:12px;cursor:pointer;transition:background .2s}
.qjayat.on{background:#E2F8EF}
.qjno{color:#3FA672;font-size:.85em}
.qjsurah{display:flex;flex-direction:column;align-items:center;margin:10px 0 4px;padding:6px;border-radius:18px;background:linear-gradient(90deg,#E2F8EF,#FFF6D9,#E2F8EF);direction:ltr}
.qjsurah .qrar{font-size:clamp(28px,4.6vw,40px);color:#3FA672;line-height:1.7}.qjsurah small{font-weight:700;color:var(--muted)}
.qjmaksud{display:none;background:var(--card);border-radius:22px;padding:14px 18px;font-size:clamp(16px,2.2vw,19px);box-shadow:0 5px 0 var(--garis)}.qjmaksud.ada{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qjayat.on{background:#2F4A3C}}:root[data-theme="dark"] .qjayat.on{background:#2F4A3C}

/* Warna tajwid */
.tn{color:#C98A00}.tp{color:#E5731A}.to{color:#E0403A}.tm{color:#A3172B}.tg{color:#1E9E57}.ta{color:#0E8F7E}.tf{color:#8E44AD}.ti{color:#2E7BD6}.tq{color:#D6338A}.tu{color:#5F7A8F}.th{color:#AAB2BE}
.tjkaki{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;background:var(--card);border-radius:20px;padding:12px 16px;font-size:14px;font-weight:700;box-shadow:0 4px 0 var(--garis);border-top:3px dashed #CFE9D8}
.tjkaki b{width:100%;text-align:center}.tjkaki span{display:inline-flex;align-items:center;gap:5px}.tjkaki i{font-style:normal;font-size:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .th{color:#7D8796}}:root[data-theme="dark"] .th{color:#7D8796}

/* Ulum Al-Quran */
.qusimbol{font-size:clamp(40px,7vw,64px)!important;padding:0 30px!important;line-height:2!important}
.qubox{background:var(--card);border-radius:22px;padding:14px 18px;box-shadow:0 5px 0 var(--garis)}.qubox b{color:#3FA672;font-size:19px}.qubox p{margin:6px 0 0;font-size:clamp(16px,2.2vw,19px)}
.quc{text-align:left;align-items:flex-start}.quc b{color:#3FA672;font-size:19px}.quc .qrmk{text-align:left}
.qubaca{align-self:flex-start;margin-top:6px;background:#E2F8EF;border:2px solid #8FD9A8;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.qukelas{align-self:center}
.qukitab{text-align:center;color:var(--muted);font-weight:700;font-size:15px}
.qumm{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.qumm span{border-radius:10px;padding:3px 8px;font-size:13px;font-weight:700}
.qumm .mk,.qubox i.mk{background:#FFE7C2;color:#9A5B00}.qumm .md,.qubox i.md{background:#D8F0FF;color:#1F5F99}.qubox i{font-style:normal;padding:0 4px;border-radius:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qubaca{background:#2F4A3C}}:root[data-theme="dark"] .qubaca{background:#2F4A3C}

/* ===== Tema Comel: pastel, bulat, berkilau ===== */
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;background:var(--latar);z-index:-2;pointer-events:none}
#hiasan{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#hiasan svg{position:absolute;animation:kilauan 3.2s ease-in-out infinite}
#hiasan .awan{animation:hanyut 14s ease-in-out infinite alternate;opacity:.75}
@keyframes kilauan{0%,100%{transform:scale(.7) rotate(0);opacity:.35}50%{transform:scale(1.1) rotate(20deg);opacity:.95}}
@keyframes hanyut{to{transform:translateX(40px)}}
h1,h2{color:var(--text);letter-spacing:.5px}
#suaraBtn{position:fixed;top:max(8px,env(safe-area-inset-top));right:calc(max(8px,env(safe-area-inset-right)) + 56px);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;padding:0;z-index:100;background:var(--card);color:var(--text);border:3px solid var(--garis);box-shadow:0 5px 0 var(--garis),0 8px 16px var(--sh)}
#suaraBtn svg{width:26px;height:26px}
#homeTitle{background:linear-gradient(90deg,#FF7EB3,#B48CFF 50%,#6EC6FF);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:clamp(34px,8vw,52px);margin-top:0;filter:drop-shadow(0 3px 0 rgba(255,255,255,.9))}
.hero{display:flex;justify-content:center;margin-top:4px}
.hero svg{width:clamp(120px,22vw,170px);height:auto;animation:apung 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 14px var(--sh))}
.hero svg.lompat{animation:lompat .6s ease 2}
.hero{cursor:pointer}
.hero .mata{transform-box:fill-box;transform-origin:center;animation:kelip 4s infinite}
.sub{color:var(--muted);font-weight:700}
.card{background:linear-gradient(115deg,var(--card) 45%,var(--cp));border:3px solid var(--cp);border-radius:32px;box-shadow:0 7px 0 color-mix(in srgb,var(--c) 55%,transparent),0 14px 26px var(--sh);position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s}
.card::after{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:var(--c);opacity:.16;pointer-events:none}
.card:hover{transform:translateY(-2px)}
.card:active{transform:translateY(6px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 55%,transparent),0 4px 10px var(--sh)}
.card .em{border-radius:28px;background:var(--c);color:var(--on);box-shadow:inset 0 -6px 0 rgba(90,50,120,.12),inset 0 5px 0 rgba(255,255,255,.45);position:relative}
.card .em::before{content:"";position:absolute;left:12px;top:9px;width:16px;height:9px;border-radius:50%;background:#fff;opacity:.6;transform:rotate(-25deg)}
.card .em svg{width:62%;height:62%}
.card .em.watak svg{width:88%;height:88%}
.card .nm{color:var(--text)}.card .ds{color:var(--muted);font-weight:700}
.card .st{color:#FFB800}
.pill,#themeBtn{background:var(--card);color:var(--text);border:3px solid var(--garis);box-shadow:0 5px 0 var(--garis),0 8px 16px var(--sh)}
.pill{display:inline-flex;align-items:center;gap:6px}
.pill svg,.ik svg,#themeBtn svg{width:26px;height:26px}
#themeBtn{width:46px;height:46px;display:grid;place-items:center}
#themeBtn svg{width:28px;height:28px}
.pill:active,.tb:active,.main:active,.speak:active,.langs button:active{transform:translateY(4px)}
.bar{height:20px;background:var(--card);border:3px solid var(--card);box-shadow:0 3px 10px var(--sh),inset 0 0 0 2px var(--garis)}
.bar i{background:repeating-linear-gradient(-45deg,#FF9EC4 0 12px,#FFB9D4 12px 24px);border-radius:99px}
.langs button{border:3px solid var(--garis);box-shadow:0 4px 0 var(--garis)}

.tb,.main,.speak{color:var(--on);box-shadow:inset 0 -6px 0 rgba(90,50,120,.16),inset 0 4px 0 rgba(255,255,255,.4),0 8px 16px var(--sh);border-radius:24px}
.speak{display:grid;place-items:center;border-radius:50%}
.speak svg{width:34px;height:34px}
.main{display:flex;align-items:center;justify-content:center;gap:8px}
.main svg{width:26px;height:26px}
.qbox,.tbsoalan,.tbnota,.crbuku{border-radius:32px;box-shadow:0 8px 0 var(--garis),0 14px 28px var(--sh)}
.qbox{border-color:var(--ungu)}
.tbnota{border-top-color:var(--koral)}
.crbuku{border-color:var(--koral)}
.opt{border-radius:26px;box-shadow:0 6px 0 color-mix(in srgb,var(--oc) 60%,transparent),0 10px 18px var(--sh);color:var(--text)}
.opt.right,.opt.wrong{color:var(--on)}
.tbub{border:3px solid var(--garis);border-radius:22px;color:var(--text)}
.tbub::after{border-top-color:var(--garis)}
.hbtn,.kbtn,.tbs{color:var(--on);box-shadow:inset 0 -5px 0 rgba(90,50,120,.16),inset 0 4px 0 rgba(255,255,255,.45),0 6px 14px var(--sh)}
.tbw.betul,.tbw.tanda,.bkata.giliran{color:var(--on)}
.bmfoto{border-color:var(--card);border-radius:30px;box-shadow:0 8px 0 var(--garis),0 14px 26px var(--sh)}
.tboard{border-radius:32px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hiasan .awan{opacity:.14}:root:not([data-theme="light"]) #homeTitle{filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}}
:root[data-theme="dark"] #hiasan .awan{opacity:.14}:root[data-theme="dark"] #homeTitle{filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
#big svg.bigsatu{width:clamp(130px,24vw,190px);height:auto}
#nBig svg.bigsatu{width:min(60%,260px);height:auto}#nBig svg.bigk{width:clamp(56px,10vw,84px);height:auto;margin:2px;animation:none}
#big svg.bigk{width:clamp(56px,10vw,84px);height:auto;margin:2px}
@font-face{font-family:"Amiri Quran";src:url("gambar/AmiriQuran.ttf") format("truetype");font-display:block}
</style>

(function(){

  const next = {light:"dark", dark:"auto", auto:"light"};
  const cur = () => { const v = R.getAttribute("data-theme"); return v === "light" || v === "dark" ? v : "auto"; };
  function show(){ const m = T[cur()]; btn.innerHTML = m[0]; btn.title = m[1]; btn.setAttribute("aria-label", m[1]); }
  btn.addEventListener("click", () => {
    const n = next[cur()];
    if (n === "auto") R.removeAttribute("data-theme"); else R.setAttribute("data-theme", n);
    try { if (n === "auto") localStorage.removeItem("tema"); else localStorage.setItem("tema", n); } catch (e) {}
    show();
  });
  show();
})();
/* ===== Utiliti ===== */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[rnd(0, arr.length - 1)];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const TOTAL = 10;

/* Bina soalan: jawapan betul + jawapan salah, dikocok */
function mk(q, a, wrongs, o) {
  return Object.assign({ q: q, a: a, opts: shuffle([a].concat(wrongs)), big: "", say: "" }, o || {});
}
/* Pilih n salah dari senarai lain */
function others(list, correct, n) {
  return shuffle(list.filter(x => x !== correct)).slice(0, n);
}
/* Nombor salah yang unik di sekitar jawapan */
function wrongNums(ans, deltas, min) {
  const set = new Set();
  let guard = 0;
  while (set.size < 3 && guard++ < 200) {
    const v = ans + pick(deltas) * pick([-1, 1]);
    if (v !== ans && v >= min) set.add(v);
  }
  let k = 1;
  while (set.size < 3) { if (ans + k !== ans) set.add(ans + k); k++; }
  return Array.from(set);
}
/* Kumpul 10 soalan unik dari penjana */
function gather(fn) {
  const out = [], seen = new Set();
  let guard = 0;
  while (out.length < TOTAL && guard++ < 500) {
    const q = fn();
    const key = q.q + q.big;
    if (!seen.has(key)) { seen.add(key); out.push(q); }
  }
  return out;
}
const fromBank = (bank, build) => () => shuffle(bank).slice(0, TOTAL).map(build);
const rm = sen => "RM" + (sen / 100).toFixed(2);

/* ===== Lukisan huruf A-Z (SVG buatan sendiri, ganti emoji) — setiap gambar beranimasi (kelas x-*) ===== */
const ART = (() => {
  const G = (c, s, o, d) => `<g class="${c}" style="transform-origin:${o || "50% 50%"}${d ? ";animation-delay:" + d : ""}">${s}</g>`;
  const E = (x, y, r) => { r = r || 4; return G("ak", `<circle cx="${x}" cy="${y}" r="${r}" fill="#2b2b2b" stroke="none"/><circle cx="${x + r * .35}" cy="${y - r * .35}" r="${r * .38}" fill="#fff" stroke="none"/>`); };
  const BL = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="5" ry="3" fill="#ff8fa3" stroke="none" opacity=".75"/>`;
  const SM = (x, y, w) => { w = w || 5; return `<path d="M${x - w} ${y} Q${x} ${y + w * 1.1} ${x + w} ${y}" fill="none"/>`; };
  const FACE = (x, y, d) => { d = d || 10; return E(x - d, y) + E(x + d, y) + SM(x, y + 7) + BL(x - d - 6, y + 7) + BL(x + d + 6, y + 7); };
  const SHADOW = (x, y, rx, c) => G(c || "", `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="4" fill="#000" opacity=".1" stroke="none"/>`);

    const cand = [s + "/" + (2 * d), (s + 1) + "/" + d, (s + 2) + "/" + d, (s - 1) + "/" + d, (a * b) + "/" + d].filter(x => x !== ans);
    const wr = Array.from(new Set(cand)).slice(0, 3);
    return mk(a + "/" + d + " + " + b + "/" + d + " = ?", ans, wr, { say: sayOp(frac(a, d), "+", frac(b, d)) });
  }
  if (t === 4) {
    const d = pick([2, 3, 4, 5]), a = rnd(1, d - 1), k = rnd(2, 9), n = d * k, r = a * k;
    const q = tr(L(a + "/" + d + " daripada " + n + " = ?", a + "/" + d + " of " + n + " = ?", n + " 的 " + a + "/" + d + " = ?"));
    const say = tr(L(frac(a, d) + " daripada " + n, frac(a, d) + " of " + n, n + "的" + frac(a, d))) + tr(sama);
    return mk(q, String(r), wrongNums(r, [1, 2, k], 1).map(String), { say: say });
  }
  if (t === 5) {
    const x = rnd(11, 99), y = rnd(11, 99), add = Math.random() < 0.5;
    const hi = Math.max(x, y), lo = Math.min(x, y);
    const r = add ? x + y : hi - lo, f = v => (v / 10).toFixed(1);
    const q = add ? f(x) + " + " + f(y) + " = ?" : f(hi) + " − " + f(lo) + " = ?";
    const say = add ? sayOp(f(x), "+", f(y)) : sayOp(f(hi), "−", f(lo));
    return mk(q, f(r), wrongNums(r, [1, 10, 5, 2], 0).map(f), { say: say });
  }

let actx = null;
function tone(freq, start, dur, type) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + start;
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* tiada audio */ }
}
const sndOk = () => { tone(660, 0, 0.15); tone(880, 0.13, 0.25); };

/* ===== Suara ===== */
const EMOJI_RE = /[\p{Extended_Pictographic}️‍]/gu;
const VOICE = { ms: ["ms-MY", "ms"], en: ["en-GB", "en-US", "en"], zh: ["zh-CN", "zh"] };
/* speak() pulangkan Promise yang selesai bila suara habis (atau dihentikan) */
/* Rakaman suara Amira (BM Malaysia) dari gambar/suara.js; tiada rakaman = suara sistem */
const SUARA = (typeof window !== "undefined" && window.SUARA) || {};
const KLIP = {};
let klipMain = null, klipNo = 0;
function mainKlip(f) {
  const no = ++klipNo;
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  KLIP[f] = KLIP[f] || fetch(f).then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => actx.decodeAudioData(b, ok, no)));
  return KLIP[f].then(buf => new Promise(selesai => {
    if (no !== klipNo) return selesai();
    const src = actx.createBufferSource();
    src.buffer = buf; src.connect(actx.destination);
    src.onended = () => selesai();
    src.start();
    klipMain = src;
  }));
}
function henti() {
  klipNo++;
  try { if (klipMain) klipMain.stop(); } catch (e) { /* abaikan */ }
  klipMain = null;
}
/* Suara boleh dimatikan (butang di penjuru atas); jika mati, tunggu sebentar supaya aliran latihan kekal sama */
let SUARA_ON = (() => { try { return localStorage.getItem("suara") === "on"; } catch (e) { return false; } })();
function speak(text, lang) {
  henti();
  if (!SUARA_ON) { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* abaikan */ } return tunggu(Math.min(2500, 300 + String(text || "").length * 35)); }
  const f = SUARA[(VOICE[lang] ? lang : "ms") + "|" + text];
  if (f) {
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* abaikan */ }
    return mainKlip(f).catch(() => { delete KLIP[f]; delete SUARA[(VOICE[lang] ? lang : "ms") + "|" + text]; return speak(text, lang); });
  }
  return new Promise(selesai => {
  setTimeout(selesai, 1500 + text.length * 150);
  try {
    const ss = window.speechSynthesis;
    if (!ss) return selesai();
    ss.cancel();
    lang = VOICE[lang] ? lang : "ms";
    const pelan = text.charAt(0) === "~";
    let clean = (pelan ? text.slice(1) : text).replace(EMOJI_RE, "");
    if (lang === "ms") clean = clean.replace(/___|\.\.\./g, " titik titik ").replace(/−/g, " tolak ").replace(/×/g, " darab ").replace(/÷/g, " bahagi ");
    else if (lang === "en") clean = clean.replace(/___|\.\.\./g, " blank ");
    else clean = clean.replace(/……|\.\.\./g, "，");
    const u = new SpeechSynthesisUtterance(clean);
    const voices = ss.getVoices() || [];
    let v = null;
    for (const w of VOICE[lang]) {
      v = voices.find(x => x.lang && x.lang.replace("_", "-").toLowerCase().indexOf(w.toLowerCase()) === 0);
      if (v) break;
    }
    u.lang = v ? v.lang : VOICE[lang][0];
    if (v) u.voice = v;
    u.rate = pelan ? 0.4 : 0.85;
    u.onend = u.onerror = () => selesai();
    ss.speak(u);
  } catch (e) { selesai(); }
  });
}

function qrNota(i, lembar) {

  k.querySelector(".qnterang").textContent = n.terang;
  k.querySelectorAll(".qntab button").forEach((b, x) => b.onclick = () => qrNota(i, x + 1));
  const el = [...k.querySelectorAll(".iqw")];
  const sebut = c => ({ sebut: c[1].split(" (")[0].split(/[- ]/).filter(Boolean) });
  el.forEach((x, j) => { x.querySelector(".qrar").textContent = ct[j][0]; x.querySelector("small").textContent = ct[j][1]; x.onclick = () => { const id = ++qrId; el.forEach(z => z.classList.remove("on")); x.classList.add("on"); iqSebut(sebut(ct[j]), id); }; });
  qrButang("speak", "Dengar Nota", "ungu", () => { const id = ++qrId; speak(n.terang, "ms").then(() => tunggu(300)).then(() => { let p = Promise.resolve(); el.forEach((x, j) => { p = p.then(() => { if (id !== qrId) return; el.forEach(z => z.classList.remove("on")); x.classList.add("on"); return iqSebut(sebut(ct[j]), id).then(() => tunggu(300)); }); }); return p; }).then(() => el.forEach(z => z.classList.remove("on"))); });
  qnNavigasi(pos);
  qrBual(n.tajuk);
  const id = qrId;
  speak(n.tajuk, "ms").then(() => id === qrId && speak(n.terang, "ms"));
}

let mOpen = [], mMoves = 0, mDone = 0, mBusy = false;
function startPadan() {
  curSubj = "g-padan"; replay = startPadan;
  const pick6 = shuffle(HURUF.filter(h => h[0] !== "X" && h[0] !== "Q")).slice(0, 6);
  const cards = shuffle(pick6.flatMap(h => { const x = hw(h); return [{ h: h, x: x, f: h[0] }, { h: h, x: x, f: artSvg(x.w), pic: true }]; }));
  mOpen = []; mMoves = 0; mDone = 0; mBusy = false;
  $("padanMoves").textContent = "🔁 0";
  const box = $("mem");
  box.innerHTML = "";
  cards.forEach(c => {
    const b = document.createElement("button");
    b.className = "mc"; b.textContent = "❓";
    b.onclick = () => flip(b, c);
    box.appendChild(b);
  });
  show("s-padan");
  speak(tr(UI.padanSay), LANG);
}
function flip(b, c) {
  if (mBusy || b.classList.contains("open") || b.classList.contains("done")) return;
  b.classList.add("open"); if (c.pic) b.innerHTML = c.f; else b.textContent = c.f;
  tone(520, 0, 0.08);
  speak(c.pic ? c.x.w : c.h[0], c.x.sl);
  mOpen.push([b, c]);
  if (mOpen.length < 2) return;
  mMoves++;
  $("padanMoves").textContent = "🔁 " + mMoves;
  const [a, z] = mOpen;
  mOpen = [];
  if (a[1].h === z[1].h) {
    [a[0], z[0]].forEach(x => { x.classList.remove("open"); x.classList.add("done"); });
    sndOk();
    speak(untuk(a[1].h, a[1].x), a[1].x.sl);
    if (++mDone === 6) setTimeout(() => showResult(mMoves <= 9 ? 3 : mMoves <= 14 ? 2 : 1, tr(UI.langkah) + mMoves), 900);
  } else {
    mBusy = true;
    setTimeout(() => {
      [a[0], z[0]].forEach(x => { x.classList.remove("open"); x.classList.add("no"); x.textContent = "❓"; });
      setTimeout(() => { [a[0], z[0]].forEach(x => x.classList.remove("no")); mBusy = false; }, 500);
    }, 900);
  }
}

let soalan = [], idx = 0, skor = 0, locked = false;
function startQuiz(id) {
  curSubj = id; replay = () => startQuiz(id);
  soalan = SUBJEK[id].gen();
  idx = 0; skor = 0;
  show("s-quiz");
  showQ();
}
function readQ() {
  const q = soalan[idx], s = SUBJEK[curSubj];
  speak(q.say || q.q, q.sl || subjLang(s));
}
function showQ() {
  const q = soalan[idx], s = SUBJEK[curSubj];
  locked = false;
  $("count").textContent = (idx + 1) + "/" + soalan.length;
  $("prog").style.width = (idx / soalan.length * 100) + "%";
  const ba = bigArt(q.big || "");
  if (q.art) $("big").innerHTML = q.art; else if (ba) $("big").innerHTML = ba; else $("big").textContent = q.big || "";
  $("qt").textContent = q.q;
  $("fb").textContent = "";
  $("nextBtn").classList.add("hide");
  const box = $("opts");
  box.innerHTML = "";
  q.opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o;
    b.onclick = () => answer(b, o);
    box.appendChild(b);
  });
  if (s.auto) readQ(); else stopSpeech();
}
function answer(btn, val) {
  if (locked) return;
  locked = true;
  const q = soalan[idx];
  const ok = val === q.a;
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (b.textContent === q.a) b.classList.add("right");
  });
  if (ok) {
    skor++;
    $("fb").textContent = tr(pick(UI.betul));
    sndOk();
  } else {
    btn.classList.add("wrong");
    $("fb").textContent = tr(UI.takApa) + q.a + " 💪";
    sndBad();
  }
  const nb = $("nextBtn");
  nb.textContent = tr(idx === soalan.length - 1 ? UI.keputusan : UI.seterusnya);
  nb.classList.remove("hide");
}
function next() {
  if (idx < soalan.length - 1) { idx++; showQ(); } else finish();
}
function finish() {
  stopSpeech();
  showResult(skor >= 8 ? 3 : skor >= 5 ? 2 : 1, tr(UI.markah) + skor + " / " + soalan.length);
}
function showResult(n, scoreText) {
  stopSpeech();
  saveStar(curSubj, n);
  $("resTitle").textContent = tr(n === 3 ? UI.r3 : n === 2 ? UI.r2 : UI.r1);
  $("resScore").textContent = scoreText;

  st.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const sp = document.createElement("span");
    sp.textContent = i < n ? "⭐" : "☆";
    sp.style.animationDelay = (i * 0.25) + "s";
    st.appendChild(sp);
  }
  show("s-result");
  sndWin();
}
